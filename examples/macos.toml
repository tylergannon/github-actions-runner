url = "https://github.com/OWNER/REPOSITORY"
name = "github-actions-runner-poc-macos"
token = "env:RUNNER_TOKEN"
provider = "tart"
runner-image = "github-actions-runner-poc-base"
labels = ["github-actions-runner-poc-macos"]
# Explicit host ceiling; size to available CPU and memory. Idle capacity stays zero.
max-runners = 2
min-runners = 0
concurrent = 2
health-port = 18089
log-file = "/Users/runner/CI/github-actions-runner/poc/logs/runner.log"
drain-timeout = "2m"

[disk]
guard = false

[tart]
home = "/Users/runner/CI/github-actions-runner/tart"
runner-dir = "/Users/admin/actions-runner"
cpu = 4
memory = 8192
pool-size = 0
cache-cleanup = true
cache-max-age = "168h"
cache-budget = 8
cache-cleanup-interval = "6h"
