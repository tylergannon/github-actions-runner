url = "https://github.com/OWNER/REPOSITORY"
name = "github-actions-runner-poc-linux"
token = "env:RUNNER_TOKEN"
provider = "docker"
runner-image = "localhost:15000/github-actions-runner-poc:local"
labels = ["github-actions-runner-poc-linux"]
# Explicit host ceiling; size to available CPU and memory. Idle capacity stays zero.
max-runners = 4
min-runners = 0
concurrent = 4
health-port = 18089
log-file = "/srv/github-actions-runner-poc/logs/runner.log"
drain-timeout = "100m"

[disk]
guard = false

[docker]
cache-volumes = ["github-actions-runner-vp:/opt/vite-plus", "github-actions-runner-mise:/home/runner/.local/share/mise", "github-actions-runner-browsers:/home/runner/.cache/ms-playwright"]
socket = "/var/run/docker.sock"
dind = false
memory = 8192
cpu = 4
pids-limit = 1024
prune = false
buildx-cleanup = false

[[docker.cache]]
name = "github-actions-runner-poc-go-mod"
path = "/cache/go-mod"
budget = "2GB"
on-exceed = "warn"

[[docker.cache]]
name = "github-actions-runner-poc-go-build"
path = "/cache/go-build"
budget = "2GB"
on-exceed = "warn"

[[docker.cache]]
name = "github-actions-runner-poc-pnpm"
path = "/cache/pnpm"
budget = "1GB"
on-exceed = "warn"

# Permanent software store; bind this volume to CI_ROOT/tools/actions.
# The upstream mount schema calls this a cache, but weekly cleanup must not clear it.
[[docker.cache]]
name = "github-actions-runner-tools"
path = "/home/runner/_work/_tool"
