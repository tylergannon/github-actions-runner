url = "https://github.com/tylergannon/github-actions-runner"
name = "github-actions-runner-poc-macos"
token = "env:RUNNER_TOKEN"
provider = "tart"
runner-image = "github-actions-runner-poc-base"
labels = ["github-actions-runner-poc-macos"]
max-runners = 1
min-runners = 0
concurrent = 1
health-port = 18089
drain-timeout = "2m"

[disk]
guard = false

[tart]
home = "/Volumes/Laptop Backups/GitHub Actions Runner/tart"
runner-dir = "/Users/admin/actions-runner"
cpu = 4
memory = 4096
pool-size = 0
cache-budget = 45
cache-cleanup-interval = "6h"
